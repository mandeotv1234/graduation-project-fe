name: Deploy Frontend

on:
  push:
    branches:
      - feature/GRAD-69-Implement-create-question-flow-for-frontend

env:
  REGISTRY: registry.digitalocean.com/graduation
  IMAGE_NAME: frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4


      - name: Login DigitalOcean Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Debug Secrets
        run: |
          echo "Kiểm tra xem Github Secret có rỗng không:"
          echo "API_URL có độ dài: ${#NEXT_PUBLIC_API_URL_SECRET}"
          echo "GOOGLE_CLIENT_ID có độ dài: ${#GOOGLE_CLIENT_ID_SECRET}"
        env:
          NEXT_PUBLIC_API_URL_SECRET: ${{ secrets.NEXT_PUBLIC_API_URL }}
          GOOGLE_CLIENT_ID_SECRET: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_SECRET="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_SECRET }}" \
            --build-arg NEXT_PUBLIC_AZURE_AD_CLIENT_ID="${{ secrets.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_AZURE_AD_TENANT_ID="${{ secrets.NEXT_PUBLIC_AZURE_AD_TENANT_ID }}" \
            --build-arg NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
            --build-arg NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
            --build-arg AZURE_AD_CLIENT_SECRET="${{ secrets.AZURE_AD_CLIENT_SECRET }}" \
            -t $REGISTRY/$IMAGE_NAME:latest .

      - name: Push Image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker login registry.digitalocean.com \
              -u ${{ secrets.DO_REGISTRY_TOKEN }} \
              -p ${{ secrets.DO_REGISTRY_TOKEN }}
            cd /root/app
            docker-compose pull frontend
            docker-compose rm -sf frontend || true
            docker-compose up -d --no-deps frontend