name: Deploy to EC2 with Docker Hub

on:
  push:
    branches: ['develop']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/graduation-project-fe:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo ${{ env.DOCKER_PASSWORD }} | docker login -u ${{ env.DOCKER_USERNAME }} --password-stdin            
            docker stop web-fe || true
            docker rm web-fe || true

            docker rmi ${{ env.DOCKER_USERNAME }}/graduation-project-fe:latest || true

            docker pull ${{ env.DOCKER_USERNAME }}/graduation-project-fe:latest

            docker run -d \
              --name web-fe \
              --restart always \
              -p 3000:3000 \
              -e NODE_ENV=production \
              ${{ env.DOCKER_USERNAME }}/graduation-project-fe:latest
